vich_uploader:
    db_driver: orm
    twig: false

    metadata:
        type: attribute

    mappings:
        school_logo:
            upload_destination: '%kernel.share_dir%/files/school/logo'
            namer:
                service: Vich\UploaderBundle\Naming\PropertyNamer
                options:
                    property: 'id'

        workers_pp:
            upload_destination: '%kernel.share_dir%/files/school/workers'
            namer:
                service: Vich\UploaderBundle\Naming\PropertyNamer
                options:
                    property: 'id'

        engineers_pp:
            upload_destination: '%kernel.share_dir%/files/school/engineers'
            namer:
                service: Vich\UploaderBundle\Naming\PropertyNamer
                options:
                    property: 'id'
