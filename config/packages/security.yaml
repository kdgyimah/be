security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users_in_db:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        api_login:
            pattern: ^/api/(login|token/refresh)$
            provider: users_in_db
            stateless: true
            json_login:
                username_path: email
                check_path: api_login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            lazy: true
            pattern: ^/api
            stateless: false        # needed for cookie-based JWT
            provider: users_in_db
            jwt: ~
            logout:
                path: api_logout
                invalidate_session: false
                delete_cookies:
                    - yesman_jwt_hp
                    - yesman_jwt_s
                    - refresh_token

    access_control:
        # Require authentication for /api/me
        - { path: ^/api/construction/me, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
